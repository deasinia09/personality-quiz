<!DOCTYPE html>
<html lang="en">

<head>
	<title>Personality Quiz Starter Code</title>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- import the webpage's stylesheet -->
	<link rel="stylesheet" href="/style.css">

	<!-- import the webpage's javascript file -->
	<script src="/script.js" defer>

	</script>
</head>

<body>

	<header>
		<h1>Take these 5 questions and see if you're a city or a suburbs person!</h1>
		<p>Answer these 5 questions truthfully and see your results at the end!.</p>
	</header>

	<main>

		<h2>What is your beverage of choice ?</h2>
		<div class="question">

			<div class="answer-choice">
				<img src="assets/cofe.jpg" alt="A cup of black coffee">
        <br>
        <button id="q1a1">Coffee</button>
      </div>

      <div class="answer-choice">
        <img src="assets/tea.jpg" alt="A cup of tea, with a teapot on the side">
        <br>
        <button id="q1a2">Tea</button>
      </div>

          <div class="answer-choice">
				<img src="assets/matcha.jpeg" alt="A cup of matcha">
        <br>
        <button id="q1a3">Matcha</button>
      </div>

      <div class="answer-choice">
        <img src="assets/coke.jpeg" alt="A bottle of Coca Cola">
        <br>
        <button id="q1a4">Coke</button>
      </div>

    </div> 

      
    
    <h2>What is your favourite season?</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="assets/winter.jpg" alt="Tree's covered in snow">
        <br>
        <button id="q2a1">Winter</button>
      </div>

      <div class="answer-choice">
        <img src="assets/summer.jpg" alt="A beach with waves and palm trees">
        <br>
        <button id="q2a2">Summer </button>
      </div>

      <div class="answer-choice">
				<img src="assets/fall.jpg" alt="Tree's with orange leaves">
        <br>
        <button id="q2a3">Autumn</button>
      </div>

      <div class="answer-choice">
        <img src="assets/spring.jpg" alt="A field full of flowers">
        <br>
        <button id="q2a4">Spring </button>
      </div>

    </div> 

      
    <h2>Pen of Choice?</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="assets/black.jpg" alt="A black pen">
        <br>
        <button id="q3a1">Black Pen</button>
      </div>

      <div class="answer-choice">
        <img src="assets/blue.jpg" alt="A blue pen">
        <br>
        <button id="q3a2">Blue Pen</button>
      </div>

      <div class="answer-choice">
				<img src="assets/pls.jpeg" alt="A pen with multiple colours">
        <br>
        <button id="q3a3">Colourful Pen</button>
      </div>

      <div class="answer-choice">
        <img src="assets/help.jpeg" alt="A pencil">
        <br>
        <button id="q3a4">Pencil</button>
      </div>

    </div> 

    <h2>How many kids?</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="assets/1.png" alt="One child">
        <br>
        <button id="q4a1">1</button>
      </div>

      <div class="answer-choice">
        <img src="assets/2.jpeg" alt="Two kids">
        <br>
        <button id="q4a2">2</button>
      </div>

      <div class="answer-choice">
		<img src="assets/3.jpeg" alt="3 kids">
        <br>
        <button id="q4a3">3</button>
      </div>

      <div class="answer-choice">
        <img src="assets/6.jpeg" alt="6 kids">
        <br>
        <button id="q4a4">4+</button>
      </div>  

    <h2>Where to live?</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="assets/city.jpeg" alt="An apartment with a view of brooklyn bridge">
        <br>
        <button id="q5a1">A small apartment with  a view and no commute</button>
      </div>

      <div class="answer-choice">
        <img src="assets/sub.jpeg" alt="A big house with a pool">
        <br>
        <button id="q5a2">A big house with a pool but long commute</button>
      </div>

    </div> 

      
    
    <h2 id="result">Your result is...</h2>
    
    
  </main>
  </body>
</html>
